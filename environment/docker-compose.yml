services:
  postgres:
    image: ${POSTGRES_IMAGE:?run scripts/pin-images.ps1}
    environment:
      POSTGRES_DB: halo
      POSTGRES_USER: halo
      POSTGRES_PASSWORD: halo-qe-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halo -d halo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  halo:
    image: ${HALO_IMAGE:?run scripts/pin-images.ps1}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_R2DBC_URL: r2dbc:pool:postgresql://postgres:5432/halo
      SPRING_R2DBC_USERNAME: halo
      SPRING_R2DBC_PASSWORD: halo-qe-local
      SPRING_SQL_INIT_PLATFORM: postgresql
      HALO_EXTERNAL_URL: http://127.0.0.1:8090/
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SERVER_REACTIVE_SESSION_TIMEOUT: ${HALO_SESSION_TIMEOUT:-PT30M}
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - halo-data:/root/.halo2

volumes:
  halo-data:
  postgres-data:
