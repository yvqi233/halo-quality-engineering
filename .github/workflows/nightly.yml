name: Nightly regression preparation

on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-regression:
    name: L3 nightly regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_CLI: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: Install E2E dependencies
        run: pnpm --dir e2e install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --dir e2e exec playwright install --with-deps chromium
      - name: Run prepared nightly matrix once
        id: gate
        continue-on-error: true
        shell: pwsh
        run: ./scripts/quality-gate.ps1 -Layer All -QuarantineMode Nightly
      - name: Validate nightly artifact completeness
        id: preflight
        if: always()
        continue-on-error: true
        shell: pwsh
        run: ./scripts/quality-gate-preflight.ps1 -Layer All
      - name: Start nightly evidence-upload measurement
        id: upload-start
        if: always()
        shell: pwsh
        run: "Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('startedAt=' + [DateTimeOffset]::UtcNow.ToString('O'))"
      - name: Upload nightly JUnit XML
        id: upload-nightly-junit-xml
        if: always()
        continue-on-error: false
        uses: actions/upload-artifact@v4
        with:
          name: nightly-junit-xml
          path: |
            api-tests/build/test-results/test/*.xml
            api-tests/build/test-results/integrationTest/*.xml
            artifacts/quality-gate/L2/**/junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload nightly API evidence
        id: upload-nightly-api-evidence
        if: always()
        continue-on-error: false
        uses: actions/upload-artifact@v4
        with:
          name: nightly-api-evidence
          path: api-tests/build/evidence/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload nightly Playwright report
        id: upload-nightly-playwright-report
        if: always()
        continue-on-error: false
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: |
            artifacts/quality-gate/L2/manifests/report-files.txt
            artifacts/quality-gate/L2/**/junit.xml
            artifacts/quality-gate/L2/**/html-report/**
            artifacts/quality-gate/L2/**/SANITIZATION_FAILED.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload nightly Playwright traces
        id: upload-nightly-playwright-traces
        if: always()
        continue-on-error: false
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-traces
          path: |
            artifacts/quality-gate/L2/manifests/trace-files.txt
            artifacts/quality-gate/L2/**/trace.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload nightly Playwright videos
        id: upload-nightly-playwright-videos
        if: always()
        continue-on-error: false
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-videos
          path: |
            artifacts/quality-gate/L2/manifests/video-files.txt
            artifacts/quality-gate/L2/**/*.webm
          if-no-files-found: error
          retention-days: 14
      - name: Upload nightly contract evidence
        id: upload-nightly-contract-evidence
        if: always()
        continue-on-error: false
        uses: actions/upload-artifact@v4
        with:
          name: nightly-contract-evidence
          path: |
            artifacts/quality-gate/L0/live-openapi.json
            artifacts/quality-gate/L0/openapi-findings.json
            artifacts/quality-gate/L0/quarantine.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload nightly gate metadata
        id: upload-nightly-gate-metadata
        if: always()
        continue-on-error: false
        uses: actions/upload-artifact@v4
        with:
          name: nightly-gate-metadata
          path: |
            artifacts/quality-gate/**/counts.json
            artifacts/quality-gate/**/quarantine.yaml
            artifacts/quality-gate/summary.jsonl
          if-no-files-found: error
          retention-days: 14
      - name: Upload nightly container logs
        id: upload-nightly-container-logs
        if: always()
        continue-on-error: false
        uses: actions/upload-artifact@v4
        with:
          name: nightly-container-logs
          path: artifacts/quality-gate/**/environment/**
          if-no-files-found: error
          retention-days: 14
      - name: Summarize and enforce prepared nightly gate
        if: always()
        shell: pwsh
        run: |
          $testResult = '${{ steps.gate.outputs.result }}'
          if (-not $testResult) { $testResult = 'FAIL' }
          $duration = '${{ steps.gate.outputs.durationSeconds }}'
          if (-not $duration) { $duration = '0' }
          $kind = '${{ steps.gate.outputs.failureKind }}'
          if (-not $kind) { $kind = 'TEST_TOOL' }
          $preflightResult = '${{ steps.preflight.outputs.result }}'
          if (-not $preflightResult) { $preflightResult = 'FAIL' }
          $preflightDuration = '${{ steps.preflight.outputs.durationSeconds }}'
          if (-not $preflightDuration) { $preflightDuration = '0' }
          $preflightKind = '${{ steps.preflight.outputs.failureKind }}'
          if (-not $preflightKind) { $preflightKind = 'TEST_TOOL' }
          $uploads = @('${{ steps.upload-nightly-junit-xml.outcome }}', '${{ steps.upload-nightly-api-evidence.outcome }}', '${{ steps.upload-nightly-playwright-report.outcome }}', '${{ steps.upload-nightly-playwright-traces.outcome }}', '${{ steps.upload-nightly-playwright-videos.outcome }}', '${{ steps.upload-nightly-contract-evidence.outcome }}', '${{ steps.upload-nightly-gate-metadata.outcome }}', '${{ steps.upload-nightly-container-logs.outcome }}')
          $uploadResult = if ($uploads -notcontains 'failure' -and $uploads -notcontains 'cancelled' -and $uploads -notcontains 'skipped') { 'PASS' } else { 'FAIL' }
          $uploadKind = if ($uploadResult -eq 'PASS') { 'NONE' } else { 'TEST_TOOL' }
          $started = [DateTimeOffset]::Parse('${{ steps.upload-start.outputs.startedAt }}')
          $uploadDuration = [Math]::Round(([DateTimeOffset]::UtcNow - $started).TotalSeconds, 3)
          $validatedQuarantinePath = 'artifacts/quality-gate/L0/quarantine.yaml'
          $quarantineLines = if (Test-Path -LiteralPath $validatedQuarantinePath -PathType Leaf) {
            @(
              '### Nightly quarantine visibility',
              '',
              'Validated quarantine records were exercised in nightly mode and remain separate from main-chain pass-rate evidence.',
              '',
              '```yaml',
              (Get-Content -Raw -LiteralPath $validatedQuarantinePath).TrimEnd(),
              '```'
            )
          } else {
            @(
              '### Nightly quarantine visibility',
              '',
              'Quarantine validation unavailable: L0 did not produce generated validated quarantine evidence.'
            )
          }
          $rows = (@(
            '| layer | result | durationSeconds | failureKind | artifactName |',
            '|---|---|---:|---|---|',
            "| L3 | $testResult | $duration | $kind | nightly-regression |",
            "| L3-evidence-preflight | $preflightResult | $preflightDuration | $preflightKind | nightly-required-artifacts |",
            "| L3-evidence-upload | $uploadResult | $uploadDuration | $uploadKind | nightly evidence artifacts |",
            ''
          ) + $quarantineLines) -join "`n"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $rows
          if ('${{ steps.gate.outcome }}' -ne 'success' -or $testResult -ne 'PASS' -or
              '${{ steps.preflight.outcome }}' -ne 'success' -or $preflightResult -ne 'PASS' -or
              $uploadResult -ne 'PASS') { exit 1 }
